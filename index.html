<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>2.1 The Cell</title>
<link rel="icon" href="tutor.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFFFF; --dot:#DCE1EA; --accent-soft:#FF9253; --surface:#FFFFFF; --stage:#EAEEF6; --ink:#1A1D29; --muted:#5A6072;
  --line:#DDE2EC; --chip:#F1F3F8; --press:#1A1D29; --press-ink:#FFFFFF; --accent:#FF5F00;
  --good:#16A05A; --good-bg:#E3F6EB; --bad:#E0434A; --bad-bg:#FDE8E9; --link:#B9C1D3;
  --shadow:0 1px 0 rgba(26,29,41,.05), 0 10px 30px -14px rgba(26,29,41,.25);
  color-scheme: light;
  box-sizing:border-box;
}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-weight:500;font-family:"Outfit",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* ---------- canvas ---------- */
#viewport{position:fixed;inset:0;overflow:hidden;touch-action:none;cursor:grab;
  background-image:radial-gradient(var(--dot) 1.2px, transparent 1.3px);background-size:24px 24px}
#viewport.panning{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
#links{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none}
#links path{fill:none;stroke:var(--link);stroke-width:2.5;stroke-linecap:round}
#links path.dash{stroke-dasharray:6 8}

.node{position:absolute;background:var(--surface);border:1.5px solid var(--line);border-radius:22px;box-shadow:var(--shadow);cursor:default;transition:border-color .2s, opacity .3s}
.node.active{border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb, var(--accent) 22%, transparent), var(--shadow)}
.node.locked{opacity:.55}
.node.locked .q-body{pointer-events:none}
.node.hidden{display:none}
.node{transition:border-color .2s, opacity .4s, filter .4s}
#world.focus-mode .node:not(.active){opacity:.14;filter:blur(3px)}
#links{transition:opacity .4s}
#world.focus-mode #links{opacity:.3}
.node-label{position:absolute;left:4px;top:-30px;font-size:14px;font-weight:700;color:var(--muted);cursor:grab;padding:4px 8px 4px 4px;border-radius:8px;white-space:nowrap;user-select:none;display:flex;gap:6px;align-items:center}
.node-label:hover{color:var(--ink);background:var(--surface)}
.node-label svg{opacity:.6}
.node-pad{padding:22px 24px 24px}

h2{font-size:26px;line-height:1.15;font-weight:800;letter-spacing:-.015em;margin:0 0 12px}
h3{font-size:19px;line-height:1.3;font-weight:800;margin:0 0 12px}
.lesson p{margin:0 0 12px}
.lesson p:last-child{margin:0}
.lesson ul{margin:0 0 12px;padding-left:20px}
.lesson li{margin:2px 0}
.lesson b{font-weight:800}
.formula{background:var(--chip);border-radius:14px;padding:12px 14px;font-weight:700;margin:0 0 12px}
table.cmp{width:100%;border-collapse:collapse;font-size:14.5px}
table.cmp th,table.cmp td{text-align:left;padding:7px 8px;border-bottom:1.5px solid var(--line);vertical-align:top}
table.cmp th{color:var(--muted);font-weight:700}
table.cmp td:first-child{font-weight:700}

/* viewer nodes */
.vnode{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:0}
.vstage{position:relative;background:var(--stage);border-radius:20px 0 0 20px;overflow:hidden;height:470px}
.vstage canvas{display:block;width:100%;height:100%;cursor:grab;touch-action:none}
.vstage canvas.pointing{cursor:pointer}
.vside{padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.tags{position:absolute;inset:0;pointer-events:none}
.tag{position:absolute;left:0;top:0;transform:translate(-50%,-100%);background:var(--press);color:var(--press-ink);font-weight:700;font-size:13.5px;padding:5px 10px;border-radius:10px;white-space:nowrap;max-width:220px;white-space:normal;text-align:center;line-height:1.3}
.tag::after{content:"";position:absolute;left:50%;bottom:-5px;width:10px;height:10px;background:var(--press);transform:translateX(-50%) rotate(45deg);border-radius:2px;z-index:-1}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px}
.seg button{border:1.5px solid var(--line);background:var(--chip);border-radius:12px;padding:7px 0;font-weight:700}
.seg button[aria-pressed="true"]{background:var(--press);color:var(--press-ink);border-color:var(--press)}
.lbl{font-weight:700;font-size:14px;margin-bottom:6px;display:flex;justify-content:space-between}
.lbl span{color:var(--muted);font-weight:500}
input[type=range]{width:100%;accent-color:var(--accent)}
.info .name{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;margin-bottom:4px}
.info .sw{width:22px;height:22px;border-radius:7px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.15);flex:none}
.info p{margin:0 0 6px;font-size:14.5px}
.info .k{color:var(--muted);font-weight:700;font-size:13px;display:block}
.info .empty{color:var(--muted);font-size:14.5px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--line);background:var(--chip);border-radius:999px;padding:4px 10px 4px 6px;font-weight:700;font-size:13px}
.chip i{width:12px;height:12px;border-radius:50%;display:block}
.chip[aria-pressed="true"]{border-color:var(--ink)}
.feat{display:grid;gap:6px}
.feat button{text-align:left;border:1.5px solid var(--line);background:var(--chip);border-radius:12px;padding:7px 12px;font-weight:700;font-size:14px}
.feat button[aria-pressed="true"]{background:var(--press);color:var(--press-ink);border-color:var(--press)}
.lens{display:grid;justify-items:center;gap:8px}
.lens-wrap{width:190px;height:190px;border-radius:50%;overflow:hidden;background:#111;box-shadow:0 0 0 7px var(--chip),0 0 0 8.5px var(--line)}
.lens-wrap canvas{width:100%;height:100%;display:block}
.calc{font-size:16px;font-weight:700;text-align:center}
.calc b{color:var(--accent)}

/* quiz */
.q-tag{font-size:13.5px;font-weight:700;color:var(--muted);margin-bottom:6px}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:11px 14px;font-weight:600;box-shadow:0 2px 0 var(--line);transition:transform .08s}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt:active:not(:disabled){transform:translateY(2px);box-shadow:none}
.opt .key{flex:none;width:26px;height:26px;border-radius:8px;background:var(--chip);display:grid;place-items:center;font-size:13px;font-weight:800}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--good);background:var(--good-bg);box-shadow:0 2px 0 var(--good)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg);box-shadow:0 2px 0 var(--bad)}
.num{display:flex;gap:8px;align-items:center}
.num .x{font-weight:800;font-size:20px}
.num input{width:120px;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface);font-weight:700;font-size:18px}
.num input.right{border-color:var(--good);background:var(--good-bg)}
.num input.wrong{border-color:var(--bad);background:var(--bad-bg)}
.btn{border:0;background:var(--press);color:var(--press-ink);border-radius:12px;padding:10px 18px;font-weight:800}
.btn:disabled{opacity:.35;cursor:default}
.btn.ghost{background:var(--chip);color:var(--ink);border:1.5px solid var(--line)}
.fb{margin-top:12px;border-radius:14px;padding:12px 14px;font-weight:600;display:none}
.fb.show{display:block}
.fb.right{background:var(--good-bg);color:var(--ink)}
.fb.wrong{background:var(--bad-bg);color:var(--ink)}
.fb strong{display:block;font-weight:800}
.fb.right strong{color:var(--good)}
.fb.wrong strong{color:var(--bad)}
.q-actions{margin-top:12px;display:flex;justify-content:flex-end}
.q-actions[hidden]{display:none}
.rev-kicker{color:var(--accent);font-weight:800;font-size:14px;margin-bottom:4px}
.done-score{font-size:56px;font-weight:800;letter-spacing:-.03em;line-height:1}

/* ---------- HUD ---------- */
.topbar{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);display:flex;gap:4px;align-items:center;background:var(--surface);border:1.5px solid var(--line);border-radius:999px;padding:5px;box-shadow:var(--shadow);z-index:5}
.topbar .t{font-weight:800;padding:0 12px 0 10px}
.stepbtn{border:0;background:transparent;border-radius:999px;padding:6px 14px;font-weight:700;color:var(--muted);display:flex;align-items:center;gap:8px}
.stepbtn .n{width:22px;height:22px;border-radius:50%;background:var(--chip);display:grid;place-items:center;font-size:12.5px;font-weight:800}
.stepbtn.current{background:var(--press);color:var(--press-ink)}
.stepbtn.current .n{background:var(--accent);color:#fff}
.stepbtn.done .n{background:var(--good);color:#fff}

.zoom{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;gap:2px;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:4px;box-shadow:var(--shadow);z-index:5}
.zoom button{border:0;background:transparent;border-radius:10px;min-width:36px;height:34px;font-weight:800;padding:0 8px}
.zoom button:hover{background:var(--chip)}
.zoom .pct{min-width:56px;font-weight:700;color:var(--muted)}

.tutor{position:fixed;left:calc(18px + env(safe-area-inset-left,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));width:360px;z-index:6;display:flex;flex-direction:column;align-items:flex-start}
.avatar{width:150px;height:auto;margin:0 0 -6px 18px;filter:drop-shadow(0 14px 14px rgba(0,0,0,.18));animation:float 3.6s ease-in-out infinite;transform-origin:50% 90%;pointer-events:none;user-select:none}
.tutor.talking .avatar{animation:float 3.6s ease-in-out infinite, talk .32s ease-in-out infinite alternate}
@keyframes float{0%,100%{translate:0 0}50%{translate:0 -8px}}
@keyframes talk{from{scale:1 1}to{scale:1.04 .95}}
@property --ga{syntax:"<angle>";initial-value:0deg;inherits:false}
@property --gp{syntax:"<percentage>";initial-value:5%;inherits:false}
.panel-wrap{position:relative;width:100%}
.panel-wrap::before{content:"";position:absolute;inset:-3px;border-radius:26px;pointer-events:none;opacity:0;transition:opacity .5s;
  background:conic-gradient(from var(--ga),transparent,var(--accent) 12%,var(--accent-soft) 24%,var(--accent) 36%,transparent 50%,var(--accent) 62%,var(--accent-soft) 74%,var(--accent) 86%,transparent);
  filter:blur(18px);animation:gleam 3s linear infinite}
.panel{position:relative;width:100%;border-radius:22px;padding:16px;box-shadow:var(--shadow);
  border:1.5px solid var(--accent);background:var(--surface);transition:border-color .4s}
.tutor.talking .panel, .tutor.thinking .panel{
  border:2px solid transparent;padding:15.5px;
  background:linear-gradient(var(--surface),var(--surface)) padding-box,
    conic-gradient(from var(--ga),transparent,var(--accent) var(--gp),#fff calc(var(--gp)*2),var(--accent) calc(var(--gp)*3),transparent calc(var(--gp)*4)) border-box,
    conic-gradient(from calc(var(--ga) + 180deg),transparent,var(--accent) var(--gp),var(--accent-soft) calc(var(--gp)*2),var(--accent) calc(var(--gp)*3),transparent calc(var(--gp)*4)) border-box,
    linear-gradient(color-mix(in srgb,var(--accent) 35%,transparent),color-mix(in srgb,var(--accent) 35%,transparent)) border-box;
  --gp:12%;animation:gleam 2.2s linear infinite}
.tutor.talking .panel-wrap::before, .tutor.thinking .panel-wrap::before{opacity:.5}
@keyframes gleam{to{--ga:360deg}}
@media (prefers-reduced-motion: reduce){ .panel, .panel-wrap::before{animation:none!important} }
.bubble{font-size:17px;line-height:1.5;min-height:74px;max-height:30vh;overflow:auto;font-weight:600}
.bubble .you{display:block;color:var(--muted);font-size:14px;font-weight:600;margin-bottom:4px}
.nav{display:flex;gap:8px;margin-top:12px}
.nav .btn{flex:1}
.nav .btn.ghost{flex:0 0 auto}
.ask{display:flex;gap:6px;margin-top:10px;border-top:1.5px solid var(--line);padding-top:10px}
.ask input{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:12px;padding:9px 12px;background:var(--chip);font-weight:500}
.ask input:focus{outline:none;border-color:var(--accent);background:var(--surface)}
.ask button{border:0;border-radius:12px;background:var(--accent);color:#fff;width:42px;display:grid;place-items:center;flex:none}
.ask button:disabled{opacity:.5}

@media (max-width:760px){
  .tutor{left:8px;right:8px;width:auto;bottom:calc(8px + env(safe-area-inset-bottom,0px))}
  .avatar{width:74px;margin-left:10px}
  .bubble{min-height:48px;max-height:22vh;font-size:15.5px}
  .topbar .t, .stepbtn .lab{display:none}
  .zoom{top:calc(14px + env(safe-area-inset-top,0px));bottom:auto;right:8px}
  .zoom .pct{display:none}
  .topbar{left:8px;transform:none}
}
@media (prefers-reduced-motion: reduce){ .avatar{animation:none!important} }
</style>
</head>
<body>
<div id="viewport" aria-label="Lesson canvas">
  <div id="world"><svg id="links"></svg></div>
</div>

<nav class="topbar" aria-label="Sections">
  <span class="t">The cell</span>
  <div id="steps" style="display:flex;gap:2px"></div>
</nav>

<div class="zoom" aria-label="Zoom">
  <button id="zOut" aria-label="Zoom out">−</button>
  <button id="zPct" class="pct" aria-label="Fit whole lesson">100%</button>
  <button id="zIn" aria-label="Zoom in">+</button>
  <button id="zBack" aria-label="Back to the tutor’s spot">Recenter</button>
</div>

<div class="tutor" id="tutor">
  <img class="avatar" src="tutor.png" alt="Your tutor">
  <div class="panel-wrap"><div class="panel">
    <div class="bubble" id="bubble" aria-live="polite"></div>
    <div class="nav">
      <button class="btn ghost" id="backBtn">Back</button>
      <button class="btn" id="nextBtn">Next</button>
    </div>
    <form class="ask" id="askForm" autocomplete="off">
      <input id="askInput" maxlength="400" aria-label="Type a question for the tutor">
      <button id="askBtn" type="submit" aria-label="Send question"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M3 9h11M9.5 4.5 14 9l-4.5 4.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </form>
  </div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/geometries/RoundedBoxGeometry.js"></script>
<script>
(function(){
"use strict";
const $ = id => document.getElementById(id);
const ease = t => t<.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2;
const tweens = [];
function tween(dur, fn, done){ const tw={t0:performance.now(),dur:Math.max(1,dur),fn,done}; tweens.push(tw); return tw; }
function rand(seed){ return function(){ seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
const esc = s => String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* =====================================================================
   3D ASSETS
   ===================================================================== */
THREE.ColorManagement.legacyMode = false;
const C = {
  wall:'#8BCF4A', membrane:'#FF7FA8', cyto:'#FFE9A8', nucleus:'#5867F0',
  chloro:'#1E9E5A', vacuole:'#7CC6FF',
  frame:'#4C5BD4', dark:'#2A2D3A', light:'#E8EBF2', knob:'#FFB020', silver:'#C7CCD8',
  lens4:'#FF5A5F', lens10:'#FFC531', lens40:'#3DA5FF', lamp:'#FFE27A'
};
const INFO = {
  wall:{name:'Cell wall',color:C.wall,what:'Tough, rigid outermost layer found only in plant cells. Made of cellulose.',does:'Resists stretching, gives mechanical support and a definite shape to the cell.'},
  membrane:{name:'Cell membrane',color:C.membrane,what:'Thin, flexible membrane enclosing the cell contents.',does:'Controls the selective movement of substances into and out of the cell.'},
  cytoplasm:{name:'Cytoplasm',color:C.cyto,what:'Jelly-like fluid inside the cell membrane.',does:'Site where chemical reactions take place.'},
  nucleus:{name:'Nucleus',color:C.nucleus,what:'Large round structure enclosed by a nuclear membrane.',does:'Controls all cell activities and stores genetic information passed from generation to generation.'},
  chloroplasts:{name:'Chloroplasts',color:C.chloro,what:'Structures containing the green pigment chlorophyll.',does:'Sites of photosynthesis: trap light energy to make food from carbon (IV) oxide and water.'},
  vacuole:{name:'Vacuole',color:C.vacuole,what:'Large, permanent central sac filled with cell sap (sugars and salts).',does:'Stores water, sugars and salts; helps keep the cell’s shape and gives support.'},
  eyepiece:{name:'Eyepiece lens',color:C.dark,what:'The lens you look through. Its power is marked on it, for example ×15.',does:'Magnifies the image. Total magnification = eyepiece × objective.'},
  objective:{name:'Objective lenses',color:C.lens10,what:'Three lenses: low power, medium power and high power.',does:'Low power gives a wide view to find features, medium a closer view, high power fine detail.'},
  stage:{name:'Stage',color:C.dark,what:'Flat platform where the slide is placed.',does:'Holds the slide in the path of the light.'},
  clips:{name:'Stage clips',color:C.silver,what:'Two clips on the stage.',does:'Secure the slide so it doesn’t move.'},
  slide:{name:'Slide and cover slip',color:C.vacuole,what:'Glass slide with a thin specimen, covered by a cover slip.',does:'The cover slip holds the specimen flat and protects the objective lens from moisture.'},
  light:{name:'Light source',color:C.lamp,what:'Lamp below the stage.',does:'Shines a beam of light up through the specimen.'}
};
const OBJ = [{mag:4,len:0.28,color:C.lens4},{mag:10,len:0.36,color:C.lens10},{mag:40,len:0.46,color:C.lens40}];
const EYE = [5,10,15];

class Viewer {
  constructor(host, kind){
    this.kind = kind; this.host = host; this.reg = {}; this.sel = []; this.hover = null; this.tagList = [];
    this.onPick = ()=>{};
    const r = this.renderer = new THREE.WebGLRenderer({antialias:true, alpha:true});
    r.setPixelRatio(Math.min(devicePixelRatio,2)); r.outputEncoding = THREE.sRGBEncoding;
    r.shadowMap.enabled = true; r.shadowMap.type = THREE.PCFSoftShadowMap; r.localClippingEnabled = true;
    host.prepend(r.domElement);
    this.tagsEl = document.createElement('div'); this.tagsEl.className = 'tags'; host.appendChild(this.tagsEl);
    const scene = this.scene = new THREE.Scene();
    this.camera = new THREE.PerspectiveCamera(35,1,0.1,100);
    const ctl = this.controls = new THREE.OrbitControls(this.camera, r.domElement);
    ctl.enableDamping = true; ctl.enablePan = false; ctl.enableZoom = false; ctl.maxPolarAngle = 1.48;
    ctl.autoRotate = kind!=='compare'; ctl.autoRotateSpeed = 0.6;
    ctl.addEventListener('start', ()=>{ ctl.autoRotate = false; });
    scene.add(new THREE.HemisphereLight(0xffffff, 0xc9d2e6, 0.85));
    const sun = new THREE.DirectionalLight(0xffffff, 0.95); sun.position.set(4,9,5); sun.castShadow = true;
    sun.shadow.mapSize.set(1536,1536); Object.assign(sun.shadow.camera,{left:-6,right:6,top:6,bottom:-6,near:1,far:25}); sun.shadow.bias=-0.0005;
    scene.add(sun);
    const rim = new THREE.DirectionalLight(0xffffff,0.35); rim.position.set(-5,3,-4); scene.add(rim);
    this.GY = -1.2;
    const ground = new THREE.Mesh(new THREE.PlaneGeometry(40,40), new THREE.ShadowMaterial({opacity:0.13}));
    ground.rotation.x = -Math.PI/2; ground.position.y = this.GY; ground.receiveShadow = true; scene.add(ground);
    this.clip = new THREE.Plane(new THREE.Vector3(0,-1,0), 2.6);
    this.groups = {};
    if(kind==='cells'){
      this.groups.plant = this.buildPlant('plant'); this.groups.animal = this.buildAnimal('animal');
      this.groups.animal.visible = false; this.current = 'plant';
      this.setView([3.6,3.5,4.6],[0,-0.1,0]);
    } else if(kind==='compare'){
      this.groups.plant = this.buildPlant('plant'); this.groups.plant.position.x = -1.95;
      this.groups.animal = this.buildAnimal('animal'); this.groups.animal.position.x = 2.0;
      this.setView([0.4,4.3,7.9],[0,-0.3,0]);
    } else {
      this.groups.scope = this.buildScope('scope'); this.state = {obj:0, eye:2};
      this.setView([3.9,2.4,5.0],[0,0.35,0]);
    }
    if(kind!=='scope'){ this.clip.constant = 0.15; }
    this.bindPicking();
    new ResizeObserver(()=>this.resize()).observe(host); this.resize();
  }
  setView(p,t){ this.camera.position.set(...p); this.controls.target.set(...t); this.controls.update(); }
  resize(){ const w=this.host.clientWidth, h=this.host.clientHeight; if(!w||!h) return; this.renderer.setSize(w,h,false); this.camera.aspect=w/h; this.camera.updateProjectionMatrix(); }
  mat(color,o={},cut=false){
    const m = new THREE.MeshStandardMaterial(Object.assign({color,roughness:.5,metalness:0},o));
    if(cut){ m.clippingPlanes=[this.clip]; m.clipShadows=true; m.side=THREE.DoubleSide; }
    return m;
  }
  mesh(geo,mat,id){ const m=new THREE.Mesh(geo,mat); m.castShadow=true; m.receiveShadow=true; if(id) m.userData.part=id; return m; }
  part(prefix,key,anchor,group,over={}){
    const id = prefix+'.'+key;
    this.reg[id] = Object.assign({id,key,prefix,materials:[],anchor:new THREE.Vector3(...anchor),group}, INFO[key], over);
    return id;
  }
  pm(id,m){ this.reg[id].materials.push(m); return m; }

  buildPlant(px){
    const g = new THREE.Group(); this.scene.add(g); const RB = THREE.RoundedBoxGeometry;
    const wall = this.part(px,'wall',[1.6,0.15,0.95],g);
    const mem = this.part(px,'membrane',[1.38,0.15,0.62],g);
    const cyt = this.part(px,'cytoplasm',[0.6,-0.3,0.7],g);
    const nuc = this.part(px,'nucleus',[-1.12,0.38,0.12],g,{what:'Large round structure enclosed by a nuclear membrane. In a plant cell it sits towards the edge.'});
    const chl = this.part(px,'chloroplasts',[0.9,-0.1,-0.66],g);
    const vac = this.part(px,'vacuole',[0.2,0.15,0],g);
    g.add(this.mesh(new RB(3.3,1.95,1.95,6,0.38), this.pm(wall,this.mat(C.wall,{},true)), wall));
    g.add(this.mesh(new RB(3.06,1.72,1.72,6,0.3), this.pm(mem,this.mat(C.membrane,{},true)), mem));
    g.add(this.mesh(new RB(3.0,1.66,1.66,6,0.28), this.pm(cyt,this.mat(C.cyto,{roughness:.7},true)), cyt));
    const v = this.mesh(new RB(1.95,1.12,1.12,6,0.45), this.pm(vac,this.mat(C.vacuole,{roughness:.42},true)), vac); v.position.x=0.2; g.add(v);
    const n = this.mesh(new THREE.SphereGeometry(0.32,48,32), this.pm(nuc,this.mat(C.nucleus)), nuc); n.position.set(-1.12,0.02,0.12); g.add(n);
    const cm = this.pm(chl,this.mat(C.chloro,{roughness:.45},true)); const cg = new THREE.CapsuleGeometry(0.11,0.2,6,14);
    const r = rand(7), spots=[];
    for(let i=0;i<40 && spots.length<26;i++){
      const f=i%4, x=-1.2+r()*2.55; let p;
      if(f===0) p=[x,-0.66,(r()-.5)*1.1]; if(f===1) p=[x,0.66,(r()-.5)*1.1];
      if(f===2) p=[x,(r()-.5)*1.1,0.66]; if(f===3) p=[x,(r()-.5)*1.1,-0.66];
      const vv=new THREE.Vector3(...p);
      if(vv.distanceTo(n.position)<0.55 || spots.some(s=>s.distanceTo(vv)<0.32)) continue;
      spots.push(vv);
    }
    [[-1.32,0.35,-0.3],[1.33,-0.2,0.25],[1.33,0.3,-0.2],[-1.32,-0.4,-0.1]].forEach(p=>spots.push(new THREE.Vector3(...p)));
    spots.forEach(s=>{ const m=this.mesh(cg,cm,chl); m.position.copy(s); m.rotation.set(r()*3,r()*3,r()*3); m.scale.set(1,1,.62); g.add(m); });
    return g;
  }
  buildAnimal(px){
    const g = new THREE.Group(); this.scene.add(g);
    const mem = this.part(px,'membrane',[1.1,0.15,0.6],g,{what:'Thin, flexible membrane enclosing the cell. With no cell wall, the shape is irregular.'});
    const cyt = this.part(px,'cytoplasm',[0.55,-0.35,0.55],g);
    const nuc = this.part(px,'nucleus',[0,0.45,0],g,{what:'Large round structure enclosed by a nuclear membrane. In an animal cell it sits near the centre.'});
    function blob(s){
      const geo = new THREE.SphereGeometry(1.3*s,120,80), p = geo.attributes.position, v = new THREE.Vector3();
      for(let i=0;i<p.count;i++){ v.fromBufferAttribute(p,i); const n=v.clone().normalize();
        const d = 1+0.09*Math.sin(3.1*n.x+1.3)*Math.sin(2.6*n.z+0.4)+0.06*Math.sin(4.7*n.y+2.2*n.x)+0.05*Math.cos(5.3*n.z-1.1);
        v.multiplyScalar(d); v.y*=0.72; v.x*=1.08; p.setXYZ(i,v.x,v.y,v.z); }
      geo.computeVertexNormals(); return geo;
    }
    g.add(this.mesh(blob(1), this.pm(mem,this.mat(C.membrane,{},true)), mem));
    g.add(this.mesh(blob(0.955), this.pm(cyt,this.mat(C.cyto,{roughness:.7},true)), cyt));
    g.add(this.mesh(new THREE.SphereGeometry(0.4,48,32), this.pm(nuc,this.mat(C.nucleus)), nuc));
    return g;
  }
  buildScope(px){

      sld=this.part(px,'slide',[-0.2,1.35,0.3],g), lmp=this.part(px,'light',[0,0.5,0.4],g);
    const frameM = this.mat(C.frame);

    const curve = new THREE.CatmullRomCurve3([new THREE.Vector3(0,0.2,-0.6),new THREE.Vector3(0,1.1,-0.66),new THREE.Vector3(0,2.1,-0.55),new THREE.Vector3(0,2.7,-0.28)]);
    g.add(this.mesh(new THREE.TubeGeometry(curve,48,0.16,24,false), frameM));
    const cap = this.mesh(new THREE.SphereGeometry(0.16,24,16), frameM); cap.position.set(0,2.7,-0.28); g.add(cap);
    const stM = this.pm(stg,this.mat(C.dark,{roughness:.4}));
    const st = this.mesh(new RB(1.5,0.1,1.3,4,0.05), stM, stg); st.position.set(0,1.25,0.15); g.add(st);
    const sa = this.mesh(new RB(0.32,0.12,0.5,3,0.04), stM, stg); sa.position.set(0,1.22,-0.42); g.add(sa);
    const hole = this.mesh(new THREE.CylinderGeometry(0.11,0.11,0.102,32), new THREE.MeshBasicMaterial({color:C.lamp})); hole.position.set(0,1.25,0.15); g.add(hole);
    const cM = this.pm(clp,this.mat(C.silver,{metalness:.35,roughness:.35}));
    [-0.42,0.42].forEach(x=>{ const c=this.mesh(new RB(0.32,0.035,0.09,2,0.015),cM,clp); c.position.set(x,1.33,0.15); g.add(c); });
    const s = this.mesh(new THREE.BoxGeometry(1.05,0.02,0.34), this.pm(sld,this.mat(C.vacuole,{transparent:true,opacity:.55,roughness:.15})), sld); s.position.set(0,1.31,0.15); s.castShadow=false; g.add(s);
    const sp = this.mesh(new THREE.BoxGeometry(0.22,0.006,0.22), this.pm(sld,this.mat('#B07CF0')), sld); sp.position.set(0,1.323,0.15); g.add(sp);
    const lamp = this.mesh(new THREE.CylinderGeometry(0.2,0.24,0.18,40), this.pm(lmp,this.mat(C.dark)), lmp); lamp.position.set(0,0.37,0.15); g.add(lamp);
    const glowM = this.pm(lmp,this.mat(C.lamp,{emissive:new THREE.Color(C.lamp),emissiveIntensity:.35})); glowM.userData.glow = true;
    const glow = this.mesh(new THREE.CylinderGeometry(0.15,0.15,0.02,40), glowM, lmp); glow.position.set(0,0.47,0.15); g.add(glow);
    const beam = new THREE.Mesh(new THREE.CylinderGeometry(0.1,0.15,0.74,32,1,true), new THREE.MeshBasicMaterial({color:C.lamp,transparent:true,opacity:.22,depthWrite:false,side:THREE.DoubleSide}));
    beam.position.set(0,0.85,0.15); beam.userData.noPick=true; g.add(beam);
    const kM = this.mat(C.knob,{flatShading:true});
    [-1,1].forEach(sx=>{
      const k=this.mesh(new THREE.CylinderGeometry(0.26,0.26,0.1,18),kM); k.rotation.z=Math.PI/2; k.position.set(sx*0.22,1.62,-0.63); g.add(k);
      const f=this.mesh(new THREE.CylinderGeometry(0.14,0.14,0.08,14),kM); f.rotation.z=Math.PI/2; f.position.set(sx*0.31,1.62,-0.63); g.add(f);
    });
    const tM = this.mat(C.light);
    const tube = this.mesh(new THREE.CylinderGeometry(0.17,0.17,0.78,40), tM); tube.position.set(0,2.5,0.15); g.add(tube);
    const conn = this.mesh(new RB(0.3,0.42,0.38,3,0.08), tM); conn.position.set(0,2.55,-0.12); g.add(conn);
    const eM = this.pm(eye,this.mat(C.dark,{roughness:.35}));
    const e1 = this.mesh(new THREE.CylinderGeometry(0.13,0.13,0.3,40),eM,eye); e1.position.set(0,3.04,0.15); g.add(e1);
    const e2 = this.mesh(new THREE.CylinderGeometry(0.15,0.15,0.05,40),eM,eye); e2.position.set(0,3.2,0.15); g.add(e2);
    const turret = this.turret = new THREE.Group(); turret.position.set(0,2.06,-0.05); g.add(turret);
    turret.add(this.mesh(new THREE.CylinderGeometry(0.36,0.3,0.13,48), this.mat(C.dark,{roughness:.35})));
    const oM = this.pm(obj,this.mat(C.light));
    OBJ.forEach((o,i)=>{
      const a=i*2*Math.PI/3, gg=new THREE.Group(); gg.position.set(Math.sin(a)*0.2,-0.065,Math.cos(a)*0.2); turret.add(gg);
      const b=this.mesh(new THREE.CylinderGeometry(0.075,0.06,o.len,32),oM,obj); b.position.y=-o.len/2; b.userData.lens=i; gg.add(b);
      const bd=this.mesh(new THREE.CylinderGeometry(0.079,0.079,0.045,32),this.pm(obj,this.mat(o.color)),obj); bd.position.y=-o.len*0.38; bd.userData.lens=i; gg.add(bd);

  /* ---- controls used by lessons and the tutor ---- */
  show(which){
    if(this.kind!=='cells' || !this.groups[which]) return;
    this.current = which;
    Object.entries(this.groups).forEach(([k,g])=>g.visible = k===which);
    this.highlight([]); this.onShow && this.onShow(which);
  }
  setCut(v){
    const from=this.clip.constant, to=2.6-v*2.45;
    tween(800,t=>{ this.clip.constant = from+(to-from)*ease(t); });
  }
  highlight(ids, tags){
    this.sel = ids.filter(id=>this.reg[id]);
    this.setTags(tags || this.sel.map(id=>({id, text:this.reg[id].name})));
    this.onSelect && this.onSelect(this.sel[0]||null);
  }
  setTags(list){
    this.tagsEl.innerHTML=''; this.tagList = list.map(t=>{
      const el=document.createElement('div'); el.className='tag'; el.textContent=t.text; this.tagsEl.appendChild(el);
      const p = t.pos ? new THREE.Vector3(...t.pos) : null;
      return {el, id:t.id, pos:p};
    });
  }
  setObjective(i){
    if(this.kind!=='scope') return;
    const from=this.turret.rotation.y; let to=-i*2*Math.PI/3;
    while(to-from>Math.PI) to-=2*Math.PI; while(from-to>Math.PI) to+=2*Math.PI;
    this.state.obj=i; tween(600,t=>{ this.turret.rotation.y=from+(to-from)*ease(t); });
    this.onScope && this.onScope();
  }
  setEyepiece(i){ if(this.kind!=='scope') return; this.state.eye=i; this.onScope && this.onScope(); }
  totalMag(){ return EYE[this.state.eye]*OBJ[this.state.obj].mag; }

  bindPicking(){
    const el=this.renderer.domElement, ray=new THREE.Raycaster(), ndc=new THREE.Vector2();
    const pick = ev=>{
      const r=el.getBoundingClientRect();
      ndc.set(((ev.clientX-r.left)/r.width)*2-1, -((ev.clientY-r.top)/r.height)*2+1);
      ray.setFromCamera(ndc,this.camera);
      const hits = ray.intersectObjects(Object.values(this.groups).filter(g=>g.visible), true);
      for(const h of hits){
        if(h.object.userData.noPick) continue;
        if(h.object.material.clippingPlanes && h.point.y > this.clip.constant+1e-3) continue;
        if(h.object.userData.part) return h.object;
      }
      return null;
    };
    let down=null;
    el.addEventListener('pointerdown',e=>{ down=[e.clientX,e.clientY]; });
    el.addEventListener('pointerup',e=>{
      if(!down) return; const moved=Math.hypot(e.clientX-down[0],e.clientY-down[1]); down=null; if(moved>6) return;
      const o=pick(e); if(o && o.userData.lens!==undefined) this.setObjective(o.userData.lens);
      this.highlight(o?[o.userData.part]:[]); this.controls.autoRotate=false;
    });
    el.addEventListener('pointermove',e=>{ if(e.buttons) return; const o=pick(e); this.hover=o?o.userData.part:null; el.classList.toggle('pointing',!!this.hover); });
    el.addEventListener('pointerleave',()=>{ this.hover=null; });
  }
  onScreen(){ const r=this.host.getBoundingClientRect(); return r.right>0 && r.bottom>0 && r.left<innerWidth && r.top<innerHeight && r.width>2; }
  frame(now){
    if(!this.onScreen()) return;
    const pulse=0.22+0.12*Math.sin(now/260);
    Object.values(this.reg).forEach(p=>{
      const on=this.sel.includes(p.id), hov=p.id===this.hover;
      p.materials.forEach(m=>{
        if(m.userData.glow && !on && !hov){ m.emissive.set(C.lamp); m.emissiveIntensity=.35; return; }
        m.emissive.set(on||hov?'#ffffff':'#000000'); m.emissiveIntensity = on?pulse:hov?0.12:0;
      });
    });
    const w=this.host.clientWidth, h=this.host.clientHeight, v=new THREE.Vector3();
    this.tagList.forEach(t=>{
      if(t.pos) v.copy(t.pos); else { const p=this.reg[t.id]; v.copy(p.anchor); p.group.localToWorld(v); }
      v.project(this.camera);
      t.el.style.left=((v.x*.5+.5)*w)+'px'; t.el.style.top=((-v.y*.5+.5)*h-12)+'px'; t.el.style.opacity = v.z<1?1:0;
    });
    this.controls.update(); this.renderer.render(this.scene,this.camera);
  }
}

const viewport=$('viewport'), world=$('world'), linksSvg=$('links');
const cam={x:0,y:0,s:1}; let camTween=null;
function applyCam(){
  world.style.transform=`translate(${cam.x}px,${cam.y}px) scale(${cam.s})`;
  viewport.style.backgroundSize=`${24*cam.s}px ${24*cam.s}px`;
  viewport.style.backgroundPosition=`${cam.x}px ${cam.y}px`;
  $('zPct').textContent=Math.round(cam.s*100)+'%';
}
const NODES={}; const LINKS=[];
function addNode(id,x,y,w,label,html,cls=''){
  const el=document.createElement('section'); el.className='node '+cls; el.style.left=x+'px'; el.style.top=y+'px'; el.style.width=w+'px';
  el.innerHTML=`<div class="node-label"><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M1 3h10M1 6h10M1 9h10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>${esc(label)}</div>${html}`;
  world.appendChild(el);
  const n=NODES[id]={id,el,x,y,w};
  const lab=el.querySelector('.node-label');
  lab.addEventListener('pointerdown',e=>{
    e.stopPropagation(); unfocus(); lab.setPointerCapture(e.pointerId); let px=e.clientX, py=e.clientY;
    const mv=ev=>{ n.moved=true; n.x+=(ev.clientX-px)/cam.s; n.y+=(ev.clientY-py)/cam.s; px=ev.clientX; py=ev.clientY; el.style.left=n.x+'px'; el.style.top=n.y+'px'; drawLinks(); };
    const up=()=>{ lab.removeEventListener('pointermove',mv); lab.removeEventListener('pointerup',up); };
    lab.addEventListener('pointermove',mv); lab.addEventListener('pointerup',up);
  });
  return n;
}
function rectOf(n){ return {x:n.x,y:n.y,w:n.el.offsetWidth,h:n.el.offsetHeight}; }
function drawLinks(){
  linksSvg.innerHTML=LINKS.filter(([a,b])=>!NODES[a].el.classList.contains('hidden')&&!NODES[b].el.classList.contains('hidden')).map(([a,b,dash])=>{
    const A=rectOf(NODES[a]), B=rectOf(NODES[b]); let d;
    if(B.x>=A.x+A.w-10){ const x1=A.x+A.w, y1=A.y+Math.min(A.h/2,160), x2=B.x, y2=B.y+Math.min(B.h/2,160), m=(x2-x1)/2; d=`M${x1} ${y1}C${x1+m} ${y1} ${x2-m} ${y2} ${x2} ${y2}`; }
    else { const x1=A.x+A.w/2, y1=A.y+A.h, x2=B.x+B.w/2, y2=B.y-34, m=(y2-y1)/2; d=`M${x1} ${y1}C${x1} ${y1+m} ${x2} ${y2-m} ${x2} ${y2}`; }
    return `<path class="${dash?'dash':''}" d="${d}"/>`;
  }).join('');
}
function availRect(){
  const W=innerWidth, H=innerHeight;
  if(W<=760){ const t=$('tutor').getBoundingClientRect(); return {x:8,y:64,w:W-16,h:Math.max(160,t.top-72)}; }
  return {x:400,y:76,w:W-420,h:H-96};
}
function flyToRect(R, dur=750){
  const A=availRect(), pad=30;
  let s=Math.min(A.w/(R.w+pad*2), A.h/(R.h+pad*2), 1.05); s=Math.max(s,0.25);
  const tx=A.x+(A.w-R.w*s)/2-R.x*s, ty=A.y+Math.max(0,(A.h-R.h*s)/2)-R.y*s+ (R.h*s>A.h? pad*s:0);
  const f={...cam}; if(camTween) camTween.dead=true;
  camTween=tween(dur,t=>{ if(camTween.dead) return; const e=ease(t); cam.x=f.x+(tx-f.x)*e; cam.y=f.y+(ty-f.y)*e; cam.s=f.s+(s-f.s)*e; applyCam(); });
}
let focusId=null;
function unfocus(){ world.classList.remove('focus-mode'); }
function fly(id){ focusId=id; world.classList.add('focus-mode'); Object.values(NODES).forEach(n=>n.el.classList.toggle('active',n.id===id)); flyToRect(rectOf(NODES[id])); }
function fitAll(dur){
  unfocus();
  const ns=Object.values(NODES).filter(n=>!n.el.classList.contains('hidden')).map(rectOf);
  const x0=Math.min(...ns.map(r=>r.x)), y0=Math.min(...ns.map(r=>r.y))-40, x1=Math.max(...ns.map(r=>r.x+r.w)), y1=Math.max(...ns.map(r=>r.y+r.h));
  flyToRect({x:x0,y:y0,w:x1-x0,h:y1-y0},dur);
}
function zoomAt(cx,cy,f){ const s=Math.min(2.5,Math.max(0.15,cam.s*f)); cam.x=cx-(cx-cam.x)*(s/cam.s); cam.y=cy-(cy-cam.y)*(s/cam.s); cam.s=s; applyCam(); }

// pan + pinch on empty canvas
const ptrs=new Map(); let pinch=null;
viewport.addEventListener('pointerdown',e=>{
  if(!(e.target===viewport||e.target===world||e.target===linksSvg)) return;
  if(camTween) camTween.dead=true; unfocus();
  viewport.setPointerCapture(e.pointerId); ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY}); viewport.classList.add('panning');
  if(ptrs.size===2){ const [a,b]=[...ptrs.values()]; pinch={d:Math.hypot(a.x-b.x,a.y-b.y)}; }
});
viewport.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId)) return; const p=ptrs.get(e.pointerId);
  if(ptrs.size===1){ cam.x+=e.clientX-p.x; cam.y+=e.clientY-p.y; applyCam(); }
  p.x=e.clientX; p.y=e.clientY;
  if(ptrs.size===2 && pinch){ const [a,b]=[...ptrs.values()]; const d=Math.hypot(a.x-b.x,a.y-b.y); zoomAt((a.x+b.x)/2,(a.y+b.y)/2,d/pinch.d); pinch.d=d; }
});
const endPtr=e=>{ ptrs.delete(e.pointerId); if(ptrs.size<2) pinch=null; if(!ptrs.size) viewport.classList.remove('panning'); };
viewport.addEventListener('pointerup',endPtr); viewport.addEventListener('pointercancel',endPtr);
viewport.addEventListener('wheel',e=>{
  e.preventDefault(); if(camTween) camTween.dead=true; unfocus();
  if(e.ctrlKey||e.metaKey) zoomAt(e.clientX,e.clientY,Math.exp(-e.deltaY*0.01));
  else { cam.x-=e.deltaX; cam.y-=e.deltaY; applyCam(); }
},{passive:false});
$('zIn').onclick=()=>{ unfocus(); zoomAt(innerWidth/2,innerHeight/2,1.2); };
$('zOut').onclick=()=>{ unfocus(); zoomAt(innerWidth/2,innerHeight/2,1/1.2); };
$('zPct').onclick=()=>fitAll(700);
$('zBack').onclick=()=>{ if(focusId) fly(focusId); };

function layoutQuestions(){
  SECTIONS.forEach(sec=>{ let y=660; sec.questions.forEach((q,qi)=>{ const n=NODES[`${sec.id}-q${qi}`]; if(!n.moved){ n.y=y; n.el.style.top=y+'px'; } y=n.y+n.el.offsetHeight+80; }); });
  drawLinks();
}
function drawLens(cv, mag){
  const ctx=cv.getContext('2d'), W=cv.width, H=cv.height, cw=0.42*mag*1.7, ch=cw*0.38, rr=rand(3);
  ctx.fillStyle='#FBF3DA'; ctx.fillRect(0,0,W,H); ctx.save(); ctx.translate(W/2,H/2);
  const rows=Math.ceil(H/ch)+4, cols=Math.ceil(W/cw)+4;
  for(let r=-(rows/2|0);r<=rows/2;r++){ const off=(r%2)*cw*0.5;
    for(let c=-(cols/2|0);c<=cols/2;c++){ const x=c*cw+off-cw/2, y=r*ch-ch/2;
      ctx.fillStyle=`hsl(${42+rr()*8} 80% ${86+rr()*5}%)`; ctx.fillRect(x,y,cw,ch);
      ctx.lineWidth=Math.max(1.2,cw*0.035); ctx.strokeStyle='#B98A3E'; ctx.strokeRect(x,y,cw,ch);
      ctx.fillStyle='#7A4B12'; ctx.beginPath(); ctx.ellipse(x+cw*(0.15+rr()*0.7), y+ch*(rr()<.5?0.28:0.72), Math.max(1.5,cw*0.06), Math.max(1.2,ch*0.13),0,0,Math.PI*2); ctx.fill(); } }
  ctx.restore();
  const g=ctx.createRadialGradient(W/2,H/2,W*0.3,W/2,H/2,W*0.52); g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(1,'rgba(0,0,0,.45)'); ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
}

/* ---------- questions ---------- */
function questionHtml(q, uid){
  const body = q.type==='number'
    ? `<div class="num"><span class="x">×</span><input type="number" inputmode="numeric" aria-label="Your answer"><button class="btn" data-check>Check</button></div>`
    : `<div class="opts">${q.options.map((o,i)=>`<button class="opt" data-i="${i}"><span class="key">${'ABCD'[i]}</span>${esc(o)}</button>`).join('')}</div>`;
  return `<div class="node-pad"><div class="q-body"><h3>${esc(q.prompt)}</h3>${body}</div>
    <div class="fb" role="status"></div><div class="q-actions" hidden><button class="btn" data-continue>Continue</button></div></div>`;
}
function wireQuestion(n, q, cb){
  const root=n.el, fb=root.querySelector('.fb'), qa=root.querySelector('.q-actions');
  let done=false;
  const finish=ok=>{
    done=true; fb.className='fb show '+(ok?'right':'wrong');
    fb.innerHTML=`<strong>${ok?'Correct!':'Not quite.'}</strong>${esc(q.explain)}`;
    qa.hidden=false; root.querySelector('.q-body').style.pointerEvents='none'; layoutQuestions(); cb(ok);
  };
  root.querySelector('[data-continue]').addEventListener('click',()=>advance());
  if(q.type==='number'){
    const inp=root.querySelector('input'), btn=root.querySelector('[data-check]');
    const check=()=>{ if(done||inp.value==='') return; const ok=Number(inp.value)===q.answer; inp.classList.add(ok?'right':'wrong'); finish(ok); };
    btn.addEventListener('click',check); inp.addEventListener('keydown',e=>{ if(e.key==='Enter') check(); });
  } else {
    root.querySelectorAll('.opt').forEach(b=>b.addEventListener('click',()=>{
      if(done) return; const i=+b.dataset.i, ok=i===q.answer;
      root.querySelectorAll('.opt').forEach(o=>{ o.disabled=true; if(+o.dataset.i===q.answer) o.classList.add('right'); });
      if(!ok) b.classList.add('wrong'); finish(ok);
    }));
  }
}

   TUTOR
   ===================================================================== */
const bubble=$('bubble'), tutorEl=$('tutor');
let typing=null;
function say(text, you){
  if(typing) clearInterval(typing.id);
  const head = you ? `<span class="you">You asked: ${esc(you)}</span>` : '';
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  tutorEl.classList.add('talking'); let i=0;
  const out=()=>{ bubble.innerHTML=head+esc(text.slice(0,i)); };
  if(reduced){ i=text.length; out(); tutorEl.classList.remove('talking'); return; }
  typing={id:setInterval(()=>{ i+=2; out(); if(i>=text.length){ clearInterval(typing.id); typing=null; tutorEl.classList.remove('talking'); } },22)};
  typing.finish=()=>{ i=text.length; out(); };
}
bubble.addEventListener('click',()=>{ if(typing){ typing.finish(); } });
const nextBtn=$('nextBtn'), backBtn=$('backBtn');
function setNext(label, enabled=true){ nextBtn.textContent=label; nextBtn.disabled=!enabled; }

/* =====================================================================
   FLOW
   ===================================================================== */
const S={sec:0, phase:'lesson', step:0, q:0, wrong:[], rev:[], ri:0, rsub:0, first:0, total:0, lastSay:''};
function sec(){ return SECTIONS[S.sec]; }
function renderSteps(){
  $('steps').innerHTML=SECTIONS.map((s,i)=>`<button class="stepbtn ${i===S.sec&&S.phase!=='done'?'current':''} ${i<S.sec||S.phase==='done'?'done':''}" data-i="${i}"><span class="n">${i<S.sec||S.phase==='done'?'✓':i+1}</span><span class="lab">${s.short}</span></button>`).join('');
}
$('steps').addEventListener('click',e=>{ const b=e.target.closest('.stepbtn'); if(b){ const s=SECTIONS[+b.dataset.i]; fly(`${s.id}-lesson`); } });
function tsay(t){ S.lastSay=t; say(t); }

function runStep(){
  const st=sec().steps[S.step];
  fly(`${sec().id}-${st.fly}`);
  if(st.act) st.act(V);
  tsay(st.say);
  setNext(st.next||'Next'); backBtn.hidden=false; backBtn.disabled=S.step===0;
}
function startQuiz(){
  S.phase='quiz'; S.q=0; S.wrong=[]; backBtn.hidden=true; showQuestion();
}
function showQuestion(){
  const id=`${sec().id}-q${S.q}`; NODES[id].el.classList.remove('locked'); fly(id);
  tsay(S.q===0?'Here’s your first question. Pick the best answer.':'Next one. Take your time.');
  setNext('Next question',false);
  const f=NODES[id].el.querySelector('.opt, input'); f && setTimeout(()=>f.focus({preventScroll:true}),800);
}
function onAnswer(ok){
  if(S.phase==='quiz'){
    const q=sec().questions[S.q]; S.total++; if(ok) S.first++; else S.wrong.push(q.concept);
    tsay(ok ? ['Nice one!','Exactly right.','Spot on!'][S.q%3]+' '+q.explain : 'Not quite. '+q.explain+' We’ll come back to this.');
    setNext(S.q<sec().questions.length-1?'Next question':'Finish quiz', true);
  } else if(S.phase==='revise'){
    const c=sec().concepts[S.rev[S.ri]];
    tsay(ok?'That’s it! You’ve got it now.':'Not quite, but that’s okay. '+c.retry.explain);
    setNext(S.ri<S.rev.length-1?'Next topic':'Continue', true);
  }
}
function endQuiz(){
  if(!S.wrong.length){ tsay('Perfect score on this section! Let’s keep going.'); setNext(S.sec<SECTIONS.length-1?'Next section':'See my results'); S.phase='between'; return; }
  S.phase='revise'; S.rev=[...new Set(S.wrong)]; S.ri=0; S.rsub=0; runRevision();
}
function runRevision(){
  const c=sec().concepts[S.rev[S.ri]], vid=`${sec().id}-viewer`;
  if(S.rsub===0){
    fly(vid); c.act(V);
    tsay(c.say); setNext('Try a question');
  } else {
    const node=NODES[`${sec().id}-rev`]; node.el.classList.remove('hidden');
    const pad=node.el.querySelector('.node-pad');
    pad.outerHTML = `<div class="node-pad"><div class="rev-kicker">Revising: ${esc(c.title)}</div></div>`;
    const tmp=document.createElement('div'); tmp.innerHTML=questionHtml(c.retry);
    node.el.querySelector('.node-pad').append(...tmp.firstElementChild.childNodes);
    wireQuestion(node, c.retry, ok=>onAnswer(ok));
    drawLinks(); fly(node.id);
    tsay('Let’s try one like it.'); setNext('Continue',false);
  }
}
function finishSection(){
  NODES[`${sec().id}-rev`].el.classList.add('hidden'); drawLinks();
  if(S.sec<SECTIONS.length-1){ S.sec++; S.phase='lesson'; S.step=0; renderSteps(); runStep(); }
  else {
    S.phase='done'; renderSteps(); backBtn.hidden=true;
    $('doneText').outerHTML=`<p><span class="done-score">${S.first}/${S.total}</span></p><p>You answered ${S.first} of ${S.total} questions right on the first try, and revised the rest. You can keep asking me questions about cells.</p>`;
    fly('done'); tsay(`You did it! You got ${S.first} out of ${S.total} right first time. You can explore the whole board, or ask me a question.`);
    setNext('See the whole board');
  }
}
function advance(){
  if(typing) typing.finish();
  if(S.phase==='lesson'){ if(S.step<sec().steps.length-1){ S.step++; runStep(); } else startQuiz(); }
  else if(S.phase==='quiz'){ if(nextBtn.disabled) return; if(S.q<sec().questions.length-1){ S.q++; showQuestion(); } else endQuiz(); }
  else if(S.phase==='between'){ finishSection(); }
  else if(S.phase==='revise'){
    if(nextBtn.disabled) return;
    if(S.rsub===0){ S.rsub=1; runRevision(); }
    else if(S.ri<S.rev.length-1){ S.ri++; S.rsub=0; runRevision(); }
    else finishSection();
  }
  else if(S.phase==='done'){ fitAll(900); }
}
nextBtn.addEventListener('click',advance);
backBtn.addEventListener('click',()=>{ if(S.phase==='lesson'&&S.step>0){ S.step--; runStep(); } });

/* =====================================================================
   LIVE TUTOR (Gemini via /api/tutor)
   ===================================================================== */
const history=[];
function applyAction(a, first){
  const t=a.target;
  if(a.type==='highlight'){
    const scopeKeys=['eyepiece','objective','stage','clips','slide','light'];
    if(scopeKeys.includes(t)){ V.scope.highlight(['scope.'+t]); if(first) fly('mag-viewer'); return; }
    if(sec().id==='compare'){ V.compare.highlight(['plant.'+t,'animal.'+t]); if(first) fly('compare-viewer'); return; }
    const v=V.cells; const which = v.reg[`${v.current}.${t}`] ? v.current : 'plant';
    if(which!==v.current) v.show(which); v.highlight([`${which}.${t}`]); if(first) fly('cells-viewer');
  } else if(a.type==='show'){
    if(t==='microscope'){ if(first) fly('mag-viewer'); }
    else { V.cells.show(t); if(first) fly('cells-viewer'); }
  } else if(a.type==='objective'){ V.scope.setObjective([4,10,40].indexOf(+t)); if(first) fly('mag-viewer'); }
  else if(a.type==='eyepiece'){ V.scope.setEyepiece([5,10,15].indexOf(+t)); if(first) fly('mag-viewer'); }
  else if(a.type==='compare'){ V.compare.feature(t); if(first) fly('compare-viewer'); }
}
$('askForm').addEventListener('submit',async e=>{
  e.preventDefault();
  const inp=$('askInput'), msg=inp.value.trim(); if(!msg) return;
  inp.value=''; $('askBtn').disabled=true; tutorEl.classList.add('thinking');
  say('Let me think…', msg);
  let question='';
  if(S.phase==='quiz'){ const q=sec().questions[S.q]; question=q.prompt; }
  if(S.phase==='revise'&&S.rsub===1){ question=sec().concepts[S.rev[S.ri]].retry.prompt; }
  try{
    const r=await fetch('/api/tutor',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({message:msg, history, context:{section:sec().title, phase:S.phase, lesson:S.lastSay, question}})});
    const data=await r.json();
    if(!r.ok) throw new Error(data.error||'error');
    history.push({role:'user',text:msg},{role:'model',text:data.reply}); if(history.length>12) history.splice(0,2);
    (data.actions||[]).forEach((a,i)=>applyAction(a,i===0));
    say(data.reply||'Hmm, I’m not sure. Try asking another way.', msg);
  }catch(err){
    say('I couldn’t reach the live tutor just now. If you opened this file directly, deploy it to Vercel first. Otherwise, try again in a moment.', msg);
  }finally{ $('askBtn').disabled=false; tutorEl.classList.remove('thinking'); }
});

/* =====================================================================
   LOOP + START
   ===================================================================== */
function loop(now){
  for(let i=tweens.length-1;i>=0;i--){ const tw=tweens[i], t=Math.min(1,(now-tw.t0)/tw.dur); tw.fn(t); if(t>=1){ tweens.splice(i,1); tw.done&&tw.done(); } }
  Object.values(V).forEach(v=>v.frame(now));
  requestAnimationFrame(loop);
}
window.cellLab={V, fly, applyAction, state:S};
applyCam(); layoutQuestions(); renderSteps();
if(document.fonts) document.fonts.ready.then(layoutQuestions);
requestAnimationFrame(()=>{ fitAll(0); setTimeout(()=>{ runStep(); },1100); });
requestAnimationFrame(loop);
addEventListener('resize',()=>{ if(focusId) fly(focusId); });
})();
</script>
</body>
</html>
